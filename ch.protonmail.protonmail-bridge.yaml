id: ch.protonmail.protonmail-bridge
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
command: protonmail-bridge
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - shared-modules/libsecret/libsecret.json
  - name: krb5
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --sbindir=${FLATPAK_DEST}/bin
      - --disable-stati
      - --disable-rpath
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/et
      - /share/examples
      - /share/ma
    sources:
      - type: archive
        url: https://github.com/krb5/krb5/archive/refs/tags/krb5-1.21.3-final.tar.gz
        sha256: 2157d92020d408ed63ebcd886a92d1346a1383b0f91123a0473b4f69b4a24861
      - type: shell
        dest: src
        commands:
          - autoreconf -si
  - name: protonmail-bridge
    buildsystem: simple
    build-options:
      env:
        GOBIN: /app/bin
        QT_PKG_CONFIG: True
    build-commands:
      - |
        . /usr/lib/sdk/golang/enable.sh
        export GOPATH=$PWD/go
        go version
        mv vendor go/src/github.com/ProtonMail/proton-bridge/
        cd go/src/github.com/ProtonMail/proton-bridge
        make build
      - install -Dp -m 644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dp -m 644 cmd/Desktop-Bridge/deploy/linux/logo.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dp -m 644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - mkdir -p /app/lib/protonmail/bridge
      - mv cmd/Desktop-Bridge/deploy/linux/* /app/lib/protonmail/bridge/
      - ln -s /app/lib/protonmail/bridge/protonmail-bridge /app/bin/

      # from deb
      # - ar x protonmail-bridge.deb
      # - tar -xf data.tar.gz
      # - mv usr/lib/* /app/lib/
      # - install -Dp -m 644 usr/share/icons/hicolor/scalable/apps/protonmail-bridge.svg
      #   /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # - install -Dp -m 644 usr/share/applications/protonmail-bridge.desktop /app/share/applications/${FLATPAK_ID}.desktop
      # - desktop-file-edit --set-key="Icon" --set-value=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      # - desktop-file-edit --set-key="Categories" --set-value="Office;Email" /app/share/applications/${FLATPAK_ID}.desktop
      # - ln -s /app/lib/protonmail/bridge/proton-bridge /app/bin/protonmail-bridge

    sources:
      - sources.yml
      - type: git
        url: https://github.com/ProtonMail/proton-bridge
        commit: 4cc2ded00158e92f7ab38e44fffc1cf09c8bd790
        dest: go/src/github.com/ProtonMail/proton-bridge
      - type: patch
        path: patches/makefile-go-mod-vendor.patch
        dest: go/src/github.com/ProtonMail/proton-bridge
      - type: patch
        path: patches/makefile-syntax.patch
        dest: go/src/github.com/ProtonMail/proton-bridge
      - type: patch
        path: patches/makefile-dont-update-submodules.patch
        dest: go/src/github.com/ProtonMail/proton-bridge
      - type: patch
        path: patches/no-vcpkg.patch
        dest: go/src/github.com/ProtonMail/proton-bridge
      - type: file
        path: ch.protonmail.protonmail-bridge.metainfo.xml
      - type: file
        path: ch.protonmail.protonmail-bridge.desktop
